[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-intel-platform"
version = "0.1.0"
description = "CLI/API for ecommerce keyword intelligence and campaign generation"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
  "typer>=0.12.3",
  "uvicorn>=0.30.6",
  "vtracer>=0.6.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
keyword-intel = "keyword_intel.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
