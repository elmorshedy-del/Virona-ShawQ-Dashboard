[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-dna-platform"
version = "0.1.0"
description = "API for ecommerce Creative DNA profiles and SVG mark conversion"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
  "uvicorn>=0.30.6",
  "vtracer>=0.6.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
