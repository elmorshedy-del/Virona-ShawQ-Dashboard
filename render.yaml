services:
  - type: web
    name: virona-shawq-dashboard
    env: node
    buildCommand: >-
      apt-get update -qq &&
      apt-get install -y -qq --no-install-recommends
        libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1
        libgtk-3-0 libasound2 libxshmfence1 libglu1-mesa libxkbcommon0
        libpango-1.0-0 libcairo2 > /dev/null &&
      PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npm install &&
      cd client && npm install && npm run build &&
      cd ../server &&
      PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npm install &&
      PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npx --yes puppeteer browsers install chrome
    startCommand: cd server && npm start
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"
      - key: LPA_PUPPETEER_NO_SANDBOX
        value: "1"
